name: Kross upstream update

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      test_current:
        description: Test the current Kross branch or an existing update proposal
        type: boolean
        default: false
  push:
    branches: [feature/kross-echo-pro]
    paths:
      - .github/workflows/kross-upstream.yml
      - scripts/prepare-kross-upstream.sh
      - gradle/kross-version.properties

permissions:
  contents: read

concurrency:
  group: kross-upstream-update
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'elminpl/BikeRadar-Kross' && github.ref == 'refs/heads/feature/kross-echo-pro'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      test_ref: ${{ steps.branch.outputs.test_ref || steps.plan.outputs.test_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Check for a stable upstream tag
        id: plan
        env:
          TEST_CURRENT: ${{ github.event_name == 'push' || inputs.test_current }}
        run: bash scripts/prepare-kross-upstream.sh
      - name: Push the candidate branch
        if: steps.plan.outputs.prepared == 'true'
        id: branch
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          git push origin "HEAD:refs/heads/$BRANCH"
          printf 'test_ref=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Open a draft pull request
        if: steps.plan.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          TAG: ${{ steps.plan.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BASE: feature/kross-echo-pro
        run: |
          printf '[Porównanie gałęzi](%s/%s/compare/%s...%s?expand=1)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$BASE" "$BRANCH" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE" --state all --json number --jq '.[0].number // empty')
          if [[ -n $existing ]]; then
            printf 'Pull request #%s już istnieje.\n' "$existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! gh pr create --repo "$GITHUB_REPOSITORY" --draft --head "$BRANCH" --base "$BASE" \
              --title "BikeRadar-Kross na bazie $TAG" \
              --body "Propozycja aktualizacji do $TAG. Wyniki kompilacji i testów są w [GitHub Actions]($RUN_URL). Sprawdź działanie na radarze przed scaleniem."; then
            echo 'GitHub odrzucił utworzenie PR. Sprawdź uprawnienia Actions do tworzenia pull requestów lub otwórz PR z porównania w podsumowaniu.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  test:
    if: always() && needs.prepare.outputs.test_ref != '' && !cancelled()
    needs: prepare
    name: Build and test Kross update
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: UTC
      JAVA_TOOL_OPTIONS: '-Duser.timezone=UTC'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.test_ref }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: platform-tools
      - name: Install the SDK required by the candidate
        id: sdk
        run: |
          sdk=$(sed -nE 's/^ +compileSdk \{ version = release\(([0-9]+)\).*$/\1/p; s/^ +compileSdk = ([0-9]+)$/\1/p' app/build.gradle.kts)
          tools=$(sed -nE 's/^ +buildToolsVersion = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' app/build.gradle.kts)
          [[ $sdk =~ ^[0-9]+$ && $tools =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          sdkmanager "platforms;android-$sdk.0" "build-tools;$tools" || sdkmanager "platforms;android-$sdk" "build-tools;$tools"
      - name: Build and run tests
        run: |
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:verifyRoborazziDebug :app:ktlintCheck --continue --no-daemon --console=plain
      - name: Verify the Kross APK build
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: ./gradlew :app:assembleRelease :app:verifyReleaseDexKeeps -Pbikeradar.krossSideBySide --no-daemon --console=plain
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kross-upstream-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/roborazzi/
            app/build/reports/ktlint/
          retention-days: 7
